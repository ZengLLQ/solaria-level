[package]
name = "solaria-level"
version = "0.1.0"
edition = "2021"
authors = ["ZengLLQ <zengllq@users.noreply.github.com>"]
description = "High-Throughput Parallel Transaction Execution & Sealevel Lock Scheduler Engine in Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ZengLLQ/solaria-level"
keywords = ["blockchain", "sealevel", "parallel-execution", "solana", "transaction-scheduling"]
categories = ["cryptography::cryptocurrencies", "concurrency"]

[dependencies]

[[bin]]
name = "solaria"
path = "src/bin/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
opt-level = 3
